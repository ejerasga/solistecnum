services:
  - type: web
    name: solis-tectum
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CONTACT_RECIPIENT
        value: ejerasga12@gmail.com
      - key: RESEND_API_KEY
        sync: false   # you will be asked to paste this secret in the Render dashboard
